name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq nftables shellcheck
      - run: for script in common.sh install.sh torrent-blocker; do bash -n "$script"; done
      - run: shellcheck -x common.sh install.sh torrent-blocker
      - run: python3 -m unittest discover -s tests -v
